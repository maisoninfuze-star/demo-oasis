name: Supplier catalogue sync

# Re-scrapes every supplier's PUBLIC endpoints (no API keys) and commits any
# changes. Vercel redeploys automatically on push, so the site tracks the
# suppliers' sites with zero manual work.

on:
  schedule:
    - cron: '0 9 * * 1'   # every Monday 09:00 UTC (~4am Montréal)
  workflow_dispatch: {}     # manual run button in GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (rug thumbnails)
        run: pip install --quiet Pillow

      - name: Scrape WooCommerce suppliers
        working-directory: data/suppliers
        run: |
          python3 scrape_woo.py titus https://www.titusfurniture.ca
          python3 scrape_woo.py creative https://creative-homedecor.com
          python3 scrape_woo.py sofabyfancy https://sofabyfancy.com
          python3 scrape_woo.py glory https://gloryhomefurniture.ca

      - name: Scrape custom-platform suppliers
        working-directory: data/suppliers
        run: |
          python3 scrape_matrix.py
          python3 scrape_aclass.py
          python3 scrape_mazin.py
          python3 scrape_wt.py

      - name: Scrape Rugs Network (own store, with prices)
        working-directory: data/suppliers
        run: python3 scrape_rugsnetwork.py

      - name: Refresh rug thumbnails (new items only)
        working-directory: data/suppliers
        run: python3 fetch_rug_thumbs.py

      # Monarch is heavier (2,800 SKUs) — monthly is plenty for a spec catalog.
      - name: Scrape Monarch (first Monday of month)
        working-directory: data/suppliers
        run: |
          if [ "$(date +%d)" -le 07 ]; then
            python3 scrape_monarch.py || echo "monarch scrape failed — keeping previous data"
          else
            echo "skipped (not first Monday)"
          fi

      # The scrapers rewrite each feed from scratch, dropping every derived
      # field. Prices come from owner PDFs that are gitignored, so CI cannot
      # recompute them -- without this step a sync would republish 4,435 priced
      # products as price-on-request and undo the product-type corrections.
      - name: Carry prices and corrected types across the re-scrape
        working-directory: data/suppliers
        run: python3 preserve_derived.py

      # Titus and Creative publish a dealer price through the Store API, so
      # unlike the PDF suppliers these CAN be priced in CI. Owner rule: x3.5.
      # Never touches an existing price, and never Rugs Network.
      - name: Price dealer-priced feeds (x3.5)
        working-directory: data/suppliers
        run: python3 apply_feed_prices.py

      # Rebuilds the 16 Monarch bedroom collections from the corrected pieces.
      # Deterministic and needs no PDF, so it is safe to run unattended.
      - name: Rebuild bedroom collections
        working-directory: data/suppliers
        run: python3 build_bedroom_collections.py

      - name: Rebuild categorized catalogue
        working-directory: data/suppliers
        run: python3 categorize.py

      # Refuses to let a broken sync reach production.
      - name: Validate catalogue invariants
        run: python3 data/validate_catalog.py

      - name: Commit if anything changed
        run: |
          git config user.name  "supplier-sync-bot"
          git config user.email "bot@galerieoasis.ca"
          git add data/suppliers data/cat assets/rugs
          if git diff --cached --quiet; then
            echo "No catalogue changes this week."
          else
            SUMMARY=$(git diff --cached --stat | tail -1)
            git commit -m "chore: weekly supplier catalogue sync — ${SUMMARY}"
            git push
          fi
